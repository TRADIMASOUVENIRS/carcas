<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }

  /* --- player card (identical behaviour in every proposal) --- */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius, 14px); box-shadow: var(--shadow); padding: 20px 18px 18px; }
  .label { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; text-align: center; }

  .langs button { font: inherit; font-size: 1.02rem; min-height: 48px; border: 0; border-radius: 9px; background: transparent; color: var(--ink); cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background-color .15s ease, color .15s ease; }

  .resume.show { display: flex; }
  .resume button { flex: 1 1 auto; font: inherit; font-size: .98rem; min-height: 44px; padding: 0 14px; border-radius: 10px; cursor: pointer; border: 1px solid var(--accent); background: transparent; color: var(--accent); }
  .resume button.primary { background: var(--accent); color: var(--accent-ink); }
  .error { display: none; margin: 14px 0 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--accent); color: var(--accent); font-size: .95rem; }
  .error.show { display: block; }
  .tip { text-align: center; color: var(--muted); font-size: .95rem; margin: 18px 8px 0; }
  .tip svg { width: 18px; height: 18px; vertical-align: -3px; margin-right: 6px; }

  /* --- our own player controls: identical on every phone --- */
  .controls[hidden] { display: none; }

  .seek { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; }
  .time { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 2.9em; }

  #seek { -webkit-appearance: none; appearance: none; width: 100%; height: 32px; margin: 0; background: transparent; cursor: pointer; --p: 0%; }
  #seek:focus { outline: none; }
  #seek:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  #seek::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(to right, var(--accent) var(--p), var(--track, rgba(127,127,127,.3)) var(--p)); }
  #seek::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; margin-top: -7px; border-radius: 50%; background: var(--accent); border: 3px solid var(--card-solid, #fff); box-shadow: 0 1px 4px rgba(0,0,0,.35); }
  #seek::-moz-range-track { height: 6px; border-radius: 3px; background: var(--track, rgba(127,127,127,.3)); }
  #seek::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--accent); }
  #seek::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 3px solid var(--card-solid, #fff); box-shadow: 0 1px 4px rgba(0,0,0,.35); }
  .buttons { display: flex; align-items: center; justify-content: center; gap: 28px; margin-top: 10px; }
  .buttons button { -webkit-tap-highlight-color: transparent; cursor: pointer; transition: transform .1s ease; }
  .buttons button:active { transform: scale(.94); }
  .buttons button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .skip { position: relative; width: 58px; height: 58px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--ink); padding: 0; }
  .skip svg { position: absolute; inset: 11px; width: 36px; height: 36px; }
  .skip.fwd svg { transform: scaleX(-1); }
  .skip span { position: absolute; inset: 0; display: grid; place-items: center; padding-top: 2px; font: 700 .74rem/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .play { position: relative; width: 76px; height: 76px; border-radius: 50%; border: 0; padding: 0; background: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 18px rgba(0,0,0,.28); }
  .play svg { position: absolute; inset: 20px; width: 36px; height: 36px; }
  .play .i-play { left: 22px; }
  .play .i-pause, .play.playing .i-play { display: none; }
  .play.playing .i-pause { display: block; }
  .play .spinner { display: none; position: absolute; inset: 6px; border-radius: 50%; border: 3px solid transparent; border-top-color: var(--accent-ink); animation: spin .9s linear infinite; }
  .play.loading .spinner { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .play .spinner { animation-duration: 2.5s; } }

  :root {
    --paper: #120d0b; --card: rgba(34,26,21,.94); --ink: #f3eadb; --muted: #bfae96; --line: #3d3128;
    --accent: #e3b05c; --accent-ink: #1a120c; --body-font: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; --radius: 18px;

  .hero { position: relative; height: 53vh; height: 53svh; min-height: 320px; max-height: 680px; overflow: hidden; }

  @media (max-height: 700px) and (max-width: 699px) {

    .hero { height: 40vh; height: 40svh; min-height: 200px; }

    .now { margin-bottom: 2px; }
    .buttons { margin-top: 4px; gap: 22px; }
    .play { width: 68px; height: 68px; }
    .play svg { inset: 16px; }
    .play .i-play { left: 18px; }
    .skip { width: 52px; height: 52px; }
    .skip svg { inset: 8px; }
  }
  @media (min-width: 700px) {
    /* wide screens: keep the whole scene instead of zooming into it, and fade the edges into the page */
    .hero { height: 72vh; max-height: 760px; max-width: calc(72vh * 1.45); margin: 0 auto;
             -webkit-mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent);
             mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent); }
    main { margin-top: -10px; }
  }
  .langs button:not([aria-pressed="true"]) { color: #e9dcc6; }

</style>

<main>

            <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1.2" fill="currentColor"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2" fill="currentColor"/></svg>

</main>
<script>
(function () {

  var DEFAULT_LANG = "en";

  // ---------- small helpers ----------
  // Browser storage can be missing or blocked (private mode, some in-app browsers): never let it break the page.
  function store(key, value) {
    try { if (value === null) localStorage.removeItem(key); else localStorage.setItem(key, String(value)); } catch (e) {}
  }
  function read(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function fmt(seconds) {
    seconds = Math.max(0, Math.floor(seconds || 0));
    var h = Math.floor(seconds / 3600), m = Math.floor((seconds % 3600) / 60), s = seconds % 60;
    return (h ? h + ":" + String(m).padStart(2, "0") : String(m)) + ":" + String(s).padStart(2, "0");
  }
  function safePlay() {
    var p = player.play();
    if (p && p.catch) p.catch(function () {});
  }
  function duration() {
    return isFinite(player.duration) && player.duration > 0 ? player.duration : TRACKS[current].seconds;
  }

  // ---------- language ----------
  function pickInitialLang() {
    var params = new URLSearchParams(location.search);
    var forced = (params.get("lang") || location.hash.replace("#", "")).toLowerCase();
    if (TRACKS[forced]) return forced;
    var saved = read("carcas-lang");
    if (TRACKS[saved]) return saved;
    var prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""];
    for (var i = 0; i < prefs.length; i++) {
      var code = String(prefs[i]).toLowerCase().split("-")[0];
      if (TRACKS[code]) return code;
    }
    for (var j = 0; j < prefs.length; j++) {
      var near = NEAR[String(prefs[j]).toLowerCase().split("-")[0]];
      if (near) return near;
    }
    return DEFAULT_LANG;
  }
  function applyText(lang) {
    var t = TEXT[lang];
    document.documentElement.lang = lang;
    document.title = t.doc;
    document.querySelectorAll("[data-t]").forEach(function (el) {
      var key = el.getAttribute("data-t");
      if (!t[key]) return;
      if (el.hasAttribute("data-lettrine")) {
        // illuminated initial: only the first letter goes in the decorated box
        var cap = document.createElement("span");
        cap.className = "lettrine";
        cap.setAttribute("aria-hidden", "true");
        cap.textContent = t[key].charAt(0);
        var rest = document.createElement("span");
        rest.setAttribute("aria-hidden", "true");
        rest.textContent = t[key].slice(1);
        el.textContent = "";
        el.setAttribute("aria-label", t[key]);
        el.appendChild(cap);
        el.appendChild(rest);
      } else {
        el.textContent = t[key];
      }

      el.setAttribute("alt", t[el.getAttribute("data-t-alt")]);
    });
    document.querySelectorAll("[data-t-aria]").forEach(function (el) {
      var label = t[el.getAttribute("data-t-aria")];
      el.setAttribute("aria-label", label);
      el.setAttribute("title", label);
    });

  }

  function render() {
    var d = duration();
    var t = player.currentTime || 0;
    if (!dragging) {
      seek.max = String(Math.round(d));
      seek.value = String(Math.min(t, d));

    var shown = dragging ? Number(seek.value) : t;
    seek.style.setProperty("--p", (d ? Math.min(100, shown / d * 100) : 0) + "%");

    totEl.textContent = fmt(d);

    playBtn.setAttribute("title", label);

    var target = Math.max(0, Math.min(duration() - 0.5, (player.currentTime || 0) + delta));

    if (!dragging) return;
    dragging = false;
    player.currentTime = Number(seek.value);
    render();
    updatePosition();

  function updateMediaSession(lang) {
    if (!ms || typeof MediaMetadata === "undefined") return;
    try {
      ms.metadata = new MediaMetadata({
        title: TEXT[lang].title,
        artist: TEXT[lang].kicker,
        album: TEXT[lang].version,

    if (!ms || !ms.setPositionState) return;

    if (pos > 15) {
      resumeBtn.textContent = TEXT[lang].resume.replace("{t}", fmt(pos));
      resumeBtn.dataset.pos = String(pos);
      resumeBox.classList.add("show");
    } else {
      resumeBox.classList.remove("show");
    }
  }

  function setLang(lang, userChose) {
    if (!TRACKS[lang] || lang === current) return;
    if (current && player.currentTime > 0) store("carcas-pos-" + current, player.currentTime);
    player.pause();
    current = lang;
    buttons.forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.lang === lang ? "true" : "false"); });
    errorBox.classList.remove("show");
    playBtn.classList.remove("loading");
    var file = TRACKS[lang].file;
    if (player.getAttribute("src") !== file) { player.setAttribute("src", file); player.load(); }
    applyText(lang);
    updateMediaSession(lang);
    showResume(lang);
    render();
    setPlayingUI();
    if (userChose) store("carcas-lang", lang);
  }

  // ---------- wiring ----------
  // Our controls replace the browser's built-in player, whose buttons differ from one phone to another.
  // Without JavaScript the built-in player stays, so the audio always remains playable.
  player.removeAttribute("controls");
  player.style.display = "none";
  controls.hidden = false;

  buttons.forEach(function (b) { b.addEventListener("click", function () { setLang(b.dataset.lang, true); }); });
  playBtn.addEventListener("click", function () {
    if (player.paused || player.ended) safePlay(); else player.pause();
  });
  backBtn.addEventListener("click", function () { jump(-SKIP); });
  fwdBtn.addEventListener("click", function () { jump(SKIP); });
  seek.addEventListener("input", function () { dragging = true; render(); });
  seek.addEventListener("change", commitSeek);
  ["pointerup", "touchend", "blur"].forEach(function (ev) { seek.addEventListener(ev, commitSeek); });

  resumeBtn.addEventListener("click", function () {
    var pos = parseFloat(resumeBtn.dataset.pos) || 0;
    resumeBox.classList.remove("show");
    var go = function () { player.currentTime = pos; render(); safePlay(); };
    if (player.readyState >= 1) go(); else player.addEventListener("loadedmetadata", go, { once: true });
  });
  restartBtn.addEventListener("click", function () {
    store("carcas-pos-" + current, null);
    resumeBox.classList.remove("show");
    player.currentTime = 0;
    render();
    safePlay();
  });

  player.addEventListener("play", function () {
    resumeBox.classList.remove("show");
    errorBox.classList.remove("show");
    setPlayingUI();
    updateMediaSession(current); // some phones forget the cover/title after a pause: give it again
    if (ms) ms.playbackState = "playing";
    updatePosition();
  });
  player.addEventListener("playing", function () { playBtn.classList.remove("loading"); });
  player.addEventListener("waiting", function () { playBtn.classList.add("loading"); });
  player.addEventListener("canplay", function () { playBtn.classList.remove("loading"); });
  player.addEventListener("pause", function () {
    playBtn.classList.remove("loading");
    setPlayingUI();
    if (ms) ms.playbackState = "paused";
    updatePosition();
    if (player.currentTime > 0 && !player.ended) store("carcas-pos-" + current, player.currentTime);
  });
  player.addEventListener("ended", function () {
    setPlayingUI();
    if (ms) ms.playbackState = "none";
    store("carcas-pos-" + current, null);
  });
  player.addEventListener("timeupdate", function () {
    render();
    var now = Date.now();
    if (now - lastSave > 4000 && player.currentTime > 0) { lastSave = now; store("carcas-pos-" + current, player.currentTime); }
  });
  player.addEventListener("seeked", function () { render(); updatePosition(); });
  player.addEventListener("loadedmetadata", function () {
    durationEl.textContent = TEXT[current].duration.replace("{m}", Math.round(duration() / 60));
    render();
    updatePosition();
  });
  player.addEventListener("error", function () {
    if (player.error) { errorBox.classList.add("show"); playBtn.classList.remove("loading"); }
  });
  // Back on the page after the phone was locked: bring the screen and the lock-screen info up to date.
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible") return;
    render();
    setPlayingUI();
    updateMediaSession(current);
    if (ms) ms.playbackState = player.paused ? "paused" : "playing";
    updatePosition();
  });

  setLang(pickInitialLang(), false);
})();
</script>
</body>
</html>
